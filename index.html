<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漢服變裝設計智能評分與審美診斷系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for Chinese Aesthetics -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=PingFang+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Noto Serif TC"', 'serif'],
            sans: ['"PingFang TC"', 'system-ui', 'sans-serif'],
          },
          colors: {
            cinnabar: '#8c2727', // 硃砂紅
            cinnabarHover: '#721f1f',
            ink: '#1c1f24',      // 黛黑
            paper: '#faf7f2',    // 宣紙暖白
            silk: '#e8dec8',     // 絹帛米金
            jade: '#264e4a',     // 碧玉深綠
            amberGold: '#b8860b'
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar & Aesthetics */
    body {
      background-color: #f7f4ee;
      background-image: radial-gradient(#e4ded3 1px, transparent 1px);
      background-size: 24px 24px;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 9999px;
    }
    .touch-target {
      min-height: 44px;
    }
    @media print {
      .no-print { display: none !important; }
      .print-full { width: 100% !important; max-width: 100% !important; }
      body { background: white !important; }
    }
  </style>
</head>
<body class="font-sans text-ink min-h-screen flex flex-col antialiased selection:bg-cinnabar selection:text-white">

  <!-- 頂部導航列 -->

        <div>

          </h1>
          <p class="text-xs text-stone-500 font-sans">
            個人創作視覺藝術專題診斷 · 全 API 實時智能分析
          </p>
        </div>
      </div>
      <div class="flex items-center gap-2 no-print">
        <!-- API Key 設定按鈕 -->
        <button id="apiKeyBtn" class="touch-target px-3 py-2 text-xs lg:text-sm font-medium text-stone-700 bg-stone-100 hover:bg-stone-200 rounded-lg transition-colors flex items-center gap-1.5 border border-stone-200">
          <span id="apiKeyStatusDot" class="w-2 h-2 rounded-full bg-stone-400"></span>
          <span id="apiKeyBtnLabel">API 設定</span>
        </button>
        <button id="sampleBtn" class="touch-target px-3 py-2 text-xs lg:text-sm font-medium text-stone-700 bg-stone-100 hover:bg-stone-200 rounded-lg transition-colors flex items-center gap-1.5 border border-stone-200">
          <span>📄</span> 載入示範作品
        </button>
        <button id="printBtn" class="touch-target px-3 py-2 text-xs lg:text-sm font-medium text-cinnabar bg-cinnabar/10 hover:bg-cinnabar/20 rounded-lg transition-colors flex items-center gap-1.5 border border-cinnabar/20">
          <span>🖨️</span> 列印評審報告
        </button>
      </div>
    </div>
  </header>
